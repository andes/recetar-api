tags:
  - name: Profesionales
    description: |
      Perfil del profesional cacheado desde ANDES (fuente de verdad).

      - `GET /professionals/me` — perfil del profesional logueado (`formacionGrado`, matrícula, CUIT).
      - El CUIT/CUIL se resuelve desde ANDES (`cuit`) y, si falta, desde la cuenta (`users.cuil`). Si no se resuelve, la emisión de documentos responde 422.
      - El caché se refresca desde ANDES en el login y, si falta al emitir un documento, se consulta ANDES como fallback.
      - No incluye datos editables del usuario (nombre/apellido de cuenta, email, etc.).

paths:
  /professionals/me:
    get:
      tags: [Profesionales]
      summary: Perfil del profesional logueado
      description: |
        Devuelve el perfil cacheado desde ANDES: `tipoDocumento`, `documento`, `nombre`,
        `apellido`, `sexo`, `cuit` y `profesionGrado` (con matrículas).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil del profesional
        "404":
          description: No hay perfil de profesional para el usuario
