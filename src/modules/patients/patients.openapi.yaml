tags:
  - name: Pacientes
    description: |
      Gestión de pacientes del sistema.

      Andes (MPI) es la **única fuente de verdad** de pacientes. Todas las
      operaciones de lectura y escritura se resuelven contra el MPI de Andes:

      - Búsqueda en Andes (`GET /patients`, `/search`, `/dni/{dni}`, `/{id}`).
      - Alta validada con RENAPER vía Andes (`POST /patients`).
      - Actualización contra Andes (`PATCH /patients/{id}`).
      - Consulta de obras sociales (`GET /patients/coverages`) y cobertura por DNI.
      - RecetAR no mantiene copia local del paciente: sólo referencia su `_id`
        de Andes (`idMPI`).

paths:
  /patients:
    get:
      tags: [Pacientes]
      summary: Listar / buscar pacientes en Andes
      description: Devuelve pacientes activos de Andes (validados y temporales). Sin `q` lista todos; con `q` busca por nombre, apellido o documento.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Término de búsqueda en Andes (nombre, apellido o documento)
      responses:
        "200":
          description: Lista de pacientes de Andes
        "502":
          description: Andes no disponible
    post:
      tags: [Pacientes]
      summary: Alta de paciente validado con RENAPER vía Andes
      description: |
        Busca el DNI en Andes; si ya existe, reutiliza ese paciente sin crear ni
        modificar. Si no existe, valida con RENAPER (vía Andes) y crea el paciente
        en Andes con `estado: validado`. La respuesta incluye el `_id` de Andes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sex]
              description: |
                Si se envía `dni`, el paciente se valida con RENAPER y queda `validado`.
                Si no se envía `dni`, se requiere `firstName` y `lastName`, y el paciente
                se crea en ANDES con estado `temporal`.
              properties:
                dni:
                  type: string
                  description: Opcional. Si está presente, debe tener entre 6 y 11 dígitos.
                sex:
                  type: string
                  enum: [Femenino, Masculino, Otro]
                firstName:
                  type: string
                  description: Obligatorio cuando no se envía DNI.
                lastName:
                  type: string
                  description: Obligatorio cuando no se envía DNI.
                fechaNac:
                  type: string
                nombreAutopercibido:
                  type: string
                genero:
                  type: string
                  description: Género autopercibido. Valores vacíos o "Ninguno" se ignoran.
                cuil:
                  type: string
                contactos:
                  type: array
                  items:
                    type: object
                    required: [tipo, valor]
                    properties:
                      tipo:
                        type: string
                        enum: [fijo, celular, email, extranjero]
                      valor:
                        type: string
                      ranking:
                        type: integer
                      activo:
                        type: boolean
                direcciones:
                  type: array
                  items:
                    type: object
                    properties:
                      calle:
                        type: string
                      codigoPostal:
                        type: string
                      barrio:
                        type: string
                      localidad:
                        type: string
                      provincia:
                        type: string
                      pais:
                        type: string
      responses:
        "201":
          description: Paciente creado en Andes
        "400":
          description: Documento faltante o inválido
        "422":
          description: Ciudadano no encontrado en RENAPER
        "502":
          description: Andes no disponible

  /patients/{id}:
    get:
      tags: [Pacientes]
      summary: Obtener paciente por ID de Andes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Datos del paciente (Andes)
        "404":
          description: Paciente no encontrado en Andes
        "502":
          description: Andes no disponible
    patch:
      tags: [Pacientes]
      summary: Actualizar paciente en Andes
      description: Acepta campos parciales. Andes impide alterar `documento` y `estado` de un paciente validado.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dni:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                sex:
                  type: string
                  enum: [Femenino, Masculino, Otro]
                fechaNac:
                  type: string
                nombreAutopercibido:
                  type: string
                genero:
                  type: string
                  description: Género autopercibido. Valores vacíos o "Ninguno" se ignoran.
                cuil:
                  type: string
                contactos:
                  type: array
                  items:
                    type: object
                    required: [tipo, valor]
                    properties:
                      tipo:
                        type: string
                        enum: [fijo, celular, email, extranjero]
                      valor:
                        type: string
                      ranking:
                        type: integer
                      activo:
                        type: boolean
                direcciones:
                  type: array
                  items:
                    type: object
                    properties:
                      calle:
                        type: string
                      codigoPostal:
                        type: string
                      barrio:
                        type: string
                      localidad:
                        type: string
                      provincia:
                        type: string
                      pais:
                        type: string
      responses:
        "200":
          description: Paciente actualizado
        "404":
          description: Paciente no encontrado en Andes
        "422":
          description: Error de validación
        "502":
          description: Andes no disponible
    delete:
      tags: [Pacientes]
      summary: Eliminar paciente en Andes
      description: Elimina el paciente directamente en ANDES. La acción es irreversible.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Paciente eliminado
        "404":
          description: Paciente no encontrado en Andes
        "502":
          description: Andes no disponible

  /patients/{id}/validate:
    post:
      tags: [Pacientes]
      summary: Validar paciente contra RENAPER y persistir estado validado
      description: |
        Obtiene el paciente desde ANDES, lo valida contra RENAPER y actualiza sus datos
        y estado a `validado` en ANDES. Requiere que el paciente tenga DNI.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Paciente validado y actualizado
        "404":
          description: Paciente no encontrado en ANDES
        "422":
          description: El paciente no tiene DNI o RENAPER no lo encontró
        "502":
          description: Andes no disponible

  /patients/search:
    get:
      tags: [Pacientes]
      summary: Buscar pacientes en Andes
      description: Búsqueda en Andes por nombre, apellido o documento. Incluye pacientes validados y temporales.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Término de búsqueda
      responses:
        "200":
          description: Lista de pacientes que coinciden
        "502":
          description: Andes no disponible

  /patients/search-page:
    get:
      tags: [Pacientes]
      summary: Buscar pacientes con filtros y paginación
      description: |
        Devuelve pacientes activos (validados y temporales) con filtros y carga
        incremental. La respuesta incluye `items`, `hasMore`, `offset` y `limit`.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: estado
          in: query
          schema:
            type: string
        - name: sexo
          in: query
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
        - name: celular
          in: query
          schema:
            type: string
        - name: fijo
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Página de pacientes
        "422":
          description: Filtros o paginación inválidos
        "502":
          description: Andes no disponible o token de Andes inválido/sin permisos

  /patients/dni/{dni}:
    get:
      tags: [Pacientes]
      summary: Buscar paciente por DNI en Andes
      security:
        - bearerAuth: []
      parameters:
        - name: dni
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Paciente(s) encontrado(s) en Andes
        "502":
          description: Andes no disponible

  /patients/validate:
    post:
      tags: [Pacientes]
      summary: Validar identidad con RENAPER vía Andes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dni, sexo]
              properties:
                dni:
                  type: string
                sexo:
                  type: string
      responses:
        "200":
          description: Datos validados
        "400":
          description: dni o sexo faltantes
        "422":
          description: Ciudadano no encontrado
        "502":
          description: Andes no disponible

  /patients/coverages:
    get:
      tags: [Pacientes]
      summary: Listar obras sociales
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Lista de obras sociales

  /patients/coverages/{dni}:
    get:
      tags: [Pacientes]
      summary: Obtener obra social por DNI
      security:
        - bearerAuth: []
      parameters:
        - name: dni
          in: path
          required: true
          schema:
            type: string
        - name: sexo
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obra social del paciente
